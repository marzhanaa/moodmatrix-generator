      /**
       * Escapes HTML special characters safely
       */
      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      /**
       * Displays a sleek toast message
       */
      function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'pointer-events-auto flex items-center gap-2.5 px-4 py-2.5 rounded-xl border border-indigo-500/40 bg-zinc-900/95 text-indigo-200 shadow-2xl text-xs font-medium transition-all duration-300 translate-y-2 opacity-0';

          <span class="w-2 h-2 rounded-full bg-fuchsia-400"></span>
          <span>${escapeHtml(message)}</span>
        `;
        toastContainer.appendChild(toast);

        requestAnimationFrame(() => {
          toast.classList.remove('translate-y-2', 'opacity-0');
        });

        setTimeout(() => {
          toast.classList.add('translate-y-2', 'opacity-0');
          setTimeout(() => toast.remove(), 300);
        }, 2500);
      }

      /**
       * Cross-browser & iframe-safe clipboard helper
       */
      function copyToClipboard(text, successMsg) {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          textarea.style.top = '0';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(textarea);
          if (ok) {
            showToast(successMsg);
            return true;
          }
        } catch (err) {
          console.error('Copy failed:', err);
        }
        return false;
      }

      /**

       */

        const [c1, c2, c3, c4] = palette.colors;
        const uid = `svg-${shotIndex}-${Math.random().toString(36).slice(2, 6)}`;

        // Lighting-specific overlay SVG layers
        let lightingLayer = '';
        if (lightingName === 'Volumetric Fog') {
          lightingLayer = `
            <polygon points="40,0 180,0 320,180 0,180" fill="url(#${uid}-beam)" opacity="0.55" />
            <polygon points="220,0 340,0 400,180 140,180" fill="url(#${uid}-beam)" opacity="0.35" />
          `;
        } else if (lightingName === 'Chiaroscuro') {
          lightingLayer = `
            <polygon points="0,0 240,0 110,180 0,180" fill="#000000" opacity="0.72" />
            <line x1="240" y1="0" x2="110" y2="180" stroke="${c1}" stroke-width="1.5" opacity="0.6" />
          `;
        } else if (lightingName === 'Anamorphic Lens Flare') {
          lightingLayer = `
            <ellipse cx="200" cy="90" rx="195" ry="3.5" fill="${c2}" opacity="0.85" />
            <ellipse cx="200" cy="90" rx="120" ry="1.5" fill="#ffffff" opacity="0.9" />
            <circle cx="200" cy="90" r="22" fill="${c1}" opacity="0.35" />
          `;
        } else if (lightingName === 'Soft Diffused') {
          lightingLayer = `
            <circle cx="200" cy="70" r="130" fill="url(#${uid}-radial)" opacity="0.65" />
          `;
        } else if (lightingName === 'Harsh Strobe') {
          lightingLayer = `
            <polygon points="190,0 215,0 360,180 40,180" fill="#ffffff" opacity="0.22" />
            <rect x="0" y="0" width="400" height="180" fill="none" stroke="${c1}" stroke-width="3" opacity="0.45" />
          `;
        }

        // Shot-composition geometric silhouettes (Wide, Medium, ECU, Action)
        let compositionLayer = '';
        if (shotIndex === 0) {
          // Wide Establishing: Horizon + City/Monolith silhouettes
          compositionLayer = `
            <rect x="28" y="65" width="34" height="115" fill="${c4}" opacity="0.88" />
            <rect x="70" y="42" width="46" height="138" fill="${c4}" opacity="0.92" />
            <rect x="128" y="80" width="38" height="100" fill="${c4}" opacity="0.82" />
            <rect x="245" y="50" width="52" height="130" fill="${c4}" opacity="0.9" />
            <rect x="308" y="72" width="42" height="108" fill="${c4}" opacity="0.85" />
            <line x1="0" y1="145" x2="400" y2="145" stroke="${c2}" stroke-width="1" opacity="0.45" />
          `;
        } else if (shotIndex === 1) {
          // Medium Character: Off-center subject silhouette + rim light
          compositionLayer = `
            <circle cx="145" cy="68" r="26" fill="${c4}" stroke="${c1}" stroke-width="1.5" opacity="0.92" />
            <path d="M95,180 C95,122 195,122 195,180 Z" fill="${c4}" stroke="${c2}" stroke-width="1.2" opacity="0.92" />
            <rect x="250" y="30" width="90" height="120" rx="8" fill="none" stroke="${c1}" stroke-width="1" stroke-dasharray="4 4" opacity="0.45" />
          `;
        } else if (shotIndex === 2) {
          // Extreme Close-Up: Concentric optical iris / macro rings
          compositionLayer = `
            <circle cx="200" cy="90" r="68" fill="none" stroke="${c1}" stroke-width="1.2" opacity="0.45" />
            <circle cx="200" cy="90" r="46" fill="${c4}" stroke="${c2}" stroke-width="2" opacity="0.85" />
            <circle cx="200" cy="90" r="20" fill="${c1}" opacity="0.7" />
            <circle cx="212" cy="78" r="6" fill="#ffffff" opacity="0.9" />
          `;
        } else {
          // Dynamic Action: Diagonal kinetic motion vectors
          compositionLayer = `
            <line x1="-20" y1="150" x2="420" y2="30" stroke="${c1}" stroke-width="3" opacity="0.75" />
            <line x1="-20" y1="168" x2="420" y2="48" stroke="${c2}" stroke-width="1.8" opacity="0.65" />
            <line x1="40" y1="180" x2="390" y2="85" stroke="#ffffff" stroke-width="1" opacity="0.4" />
            <polygon points="160,115 245,82 225,126" fill="${c1}" opacity="0.85" />
          `;
        }

        // Genre texture overlay (e.g., 90s Anime scanlines / Vintage grain grid)
        const genreTexture = (genreName === '90s Anime' || genreName === 'Vintage Documentary')
          ? `<rect width="400" height="180" fill="url(#${uid}-scanlines)" opacity="0.28" />`
          : '';

        return `
          <svg viewBox="0 0 400 180" preserveAspectRatio="xMidYMid slice" class="w-full h-full block">
            <defs>
              <linearGradient id="${uid}-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="${c4}" />
                <stop offset="50%" stop-color="${c3}" />
                <stop offset="100%" stop-color="${c1}" stop-opacity="0.75" />
              </linearGradient>
              <radialGradient id="${uid}-radial" cx="50%" cy="40%" r="60%">
                <stop offset="0%" stop-color="${c2}" stop-opacity="0.9" />
                <stop offset="60%" stop-color="${c1}" stop-opacity="0.35" />
                <stop offset="100%" stop-color="${c4}" stop-opacity="0" />
              </radialGradient>
              <linearGradient id="${uid}-beam" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="${c2}" stop-opacity="0.85" />
                <stop offset="100%" stop-color="${c1}" stop-opacity="0" />
              </linearGradient>
              <pattern id="${uid}-scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
                <line x1="0" y1="0" x2="4" y2="0" stroke="#ffffff" stroke-width="1" />
              </pattern>
            </defs>

            <!-- Base Atmosphere -->
            <rect width="400" height="180" fill="url(#${uid}-bg)" />
            <circle cx="290" cy="45" r="110" fill="url(#${uid}-radial)" class="animate-pulse-slow" />

            <!-- Shot Composition Layer -->
            ${compositionLayer}

            <!-- Lighting Layer -->
            ${lightingLayer}

            <!-- Genre Texture -->
            ${genreTexture}

            <!-- Cinema Letterbox & Frame Guides -->
            <rect x="10" y="10" width="380" height="160" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" />
            <line x1="200" y1="82" x2="200" y2="98" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />
            <line x1="192" y1="90" x2="208" y2="90" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />
          </svg>
        `;
      }

      /**
       * Compiles a tailored AI video generation prompt for a specific shot
       */
      function buildShotPrompt(shot, genreData, paletteData, lightingData) {
        return `[${shot.type.toUpperCase()}] ${shot.subject}. Camera: ${shot.camera}, ${shot.movement}. Lighting: ${lightingData.promptDesc}. Color Grade: ${paletteData.promptDesc}. Style: ${genreData.styleKeywords} --ar 16:9`;
      }

      /**
       * Renders the 4-card Moodboard Matrix and updates top swatches
       */
      function renderMatrix() {
        const genreName = selectGenre.value;
        const paletteName = selectPalette.value;
        const lightingName = selectLighting.value;

        const genreData = GENRES[genreName];
        const paletteData = PALETTES[paletteName];
        const lightingData = LIGHTING[lightingName];

        // Update Director Note
        directorNoteEl.textContent = `Director's Note: ${genreData.note}`;

        // Update Global Palette Swatches
        globalSwatchesEl.innerHTML = paletteData.colors.map((hex, i) => `
          <button
            type="button"
            data-copy-hex="${hex}"
            title="Click to copy ${paletteData.labels[i]} (${hex})"
            class="group inline-flex items-center gap-1.5 px-2 py-1 rounded-lg bg-zinc-950 border border-zinc-800 hover:border-zinc-600 transition-all"
          >
            <span class="w-3 h-3 rounded-full border border-white/20 shadow-sm" style="background-color: ${hex};"></span>
            <span class="font-mono text-[11px] text-zinc-300 group-hover:text-white">${hex}</span>
          </button>
        `).join('');

        // Render 4 Shot Cards
        moodboardGrid.innerHTML = genreData.shots.map((shot, idx) => {
          const svgArt = buildAtmosphericSvg(idx, paletteData, lightingName, genreName);
          const compiledPrompt = buildShotPrompt(shot, genreData, paletteData, lightingData);

          const cardSwatchesHtml = paletteData.colors.map((hex, cIdx) => `
            <button
              type="button"
              data-copy-hex="${hex}"
              title="Copy ${paletteData.labels[cIdx]} (${hex})"
              class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-zinc-950/90 hover:bg-zinc-800 border border-zinc-800 hover:border-zinc-600 transition-colors"
            >
              <span class="w-2.5 h-2.5 rounded-full shrink-0 border border-white/20" style="background-color: ${hex};"></span>
              <span class="font-mono text-[10px] text-zinc-300">${hex}</span>
            </button>
          `).join('');

          return `
            <article class="bg-zinc-900 border border-zinc-800/95 hover:border-zinc-700 rounded-2xl overflow-hidden shadow-xl flex flex-col transition-all">
              <!-- Visual Atmospheric Preview -->
              <div class="relative h-44 sm:h-48 w-full overflow-hidden border-b border-zinc-800 bg-zinc-950">
                ${svgArt}

                <!-- Overlay Top Badges -->
                <div class="absolute top-3 left-3 right-3 flex items-center justify-between gap-2 pointer-events-none">
                  <span class="px-2.5 py-1 rounded-lg bg-black/65 backdrop-blur-md text-[11px] font-mono font-semibold text-white border border-white/15">
                    ${escapeHtml(shot.code)}
                  </span>
                  <span class="px-2.5 py-1 rounded-lg bg-black/65 backdrop-blur-md text-[11px] font-medium text-zinc-200 border border-white/10">
                    ${escapeHtml(lightingData.badge)}
                  </span>
                </div>

                <!-- Overlay Bottom Title -->
                <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-zinc-950 via-zinc-950/75 to-transparent pt-8 pb-3 px-4">
                  <h2 class="text-base font-bold text-white tracking-tight">${escapeHtml(shot.type)}</h2>
                  <p class="text-xs text-zinc-300 font-mono truncate mt-0.5">${escapeHtml(shot.camera)} • ${escapeHtml(shot.movement)}</p>
                </div>
              </div>

              <!-- Card Details & Prompt Body -->
              <div class="p-4 sm:p-5 flex-1 flex flex-col justify-between space-y-4">
                <div class="space-y-3">
                  <!-- Clickable Hex Swatches -->
                  <div class="flex flex-wrap items-center gap-1.5">
                    ${cardSwatchesHtml}
                  </div>

                  <!-- AI Prompt Box -->
                  <div class="rounded-xl bg-zinc-950 border border-zinc-800/90 p-3.5">
                    <div class="flex items-center justify-between mb-1.5">
                      <span class="text-[10px] font-mono uppercase tracking-wider text-zinc-500">Tailored AI Video Prompt</span>
                      <span class="text-[10px] font-mono text-indigo-400">${escapeHtml(genreName)}</span>
                    </div>
                    <p class="text-xs font-mono text-zinc-300 leading-relaxed select-all">
                      ${escapeHtml(compiledPrompt)}
                    </p>
                  </div>
                </div>

                <!-- Copy Prompt Button -->
                <button
                  type="button"
                  data-copy-prompt="${escapeHtml(compiledPrompt)}"
                  data-shot-title="${escapeHtml(shot.type)}"
                  class="w-full py-2.5 px-4 rounded-xl bg-zinc-800 hover:bg-indigo-600 text-zinc-100 hover:text-white text-xs font-semibold transition-all flex items-center justify-center gap-2 border border-zinc-700/80 hover:border-indigo-500 shadow-sm active:scale-[0.99]"
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                  </svg>
                  <span>Copy Prompt</span>
                </button>
              </div>
            </article>
          `;
        }).join('');
      }

      /**
       * Randomizes Genre, Palette, and Lighting to spark creative direction
       */
      function randomizeVibe() {
        const pickRandom = (selectEl) => {
          const options = Array.from(selectEl.options);
          if (options.length <= 1) return;
          let nextIdx = Math.floor(Math.random() * options.length);
          if (options[nextIdx].value === selectEl.value) {
            nextIdx = (nextIdx + 1) % options.length;
          }
          selectEl.selectedIndex = nextIdx;
        };

        pickRandom(selectGenre);
        pickRandom(selectPalette);
        pickRandom(selectLighting);
        renderMatrix();
        showToast(`Vibe randomized: ${selectGenre.value} × ${selectPalette.value}`);
      }

      /**
       * Copies the complete 4-shot Style Bible & technical specs
       */
      function copyFullStyleBible() {
        const genreName = selectGenre.value;
        const paletteName = selectPalette.value;
        const lightingName = selectLighting.value;

        const genreData = GENRES[genreName];
        const paletteData = PALETTES[paletteName];
        const lightingData = LIGHTING[lightingName];

        const lines = [
          '====================================================',
          'MOODMATRIX — AI VIDEO STYLE BIBLE & SHOT MATRIX',
          '====================================================',
          `GENRE: ${genreName}`,
          `COLOR PALETTE: ${paletteName} (${paletteData.colors.join(', ')})`,
          `LIGHTING STYLE: ${lightingName}`,
          `DIRECTOR'S NOTE: ${genreData.note}`,
          '----------------------------------------------------',
          ''
        ];

        genreData.shots.forEach((shot, idx) => {
          lines.push(`0${idx + 1}. ${shot.type.toUpperCase()}`);
          lines.push(`Camera & Optics: ${shot.camera} | ${shot.movement}`);
          lines.push(`Prompt: ${buildShotPrompt(shot, genreData, paletteData, lightingData)}`);
          lines.push('');
        });

        copyToClipboard(lines.join('\n'), 'Full 4-Shot Style Bible copied to clipboard!');
      }

      // Event Listeners for Dropdowns & Header Buttons
      selectGenre.addEventListener('change', renderMatrix);
      selectPalette.addEventListener('change', renderMatrix);
      selectLighting.addEventListener('change', renderMatrix);
      btnRandomize.addEventListener('click', randomizeVibe);
      btnCopyBible.addEventListener('click', copyFullStyleBible);

      // Event Delegation for Swatch Hex Copies & Individual Prompt Copies
      document.addEventListener('click', function (e) {
        const hexBtn = e.target.closest('button[data-copy-hex]');
        if (hexBtn) {
          const hex = hexBtn.getAttribute('data-copy-hex');
          copyToClipboard(hex, `Copied color swatch ${hex}`);
          return;
        }

        const promptBtn = e.target.closest('button[data-copy-prompt]');
        if (promptBtn) {
          const promptText = promptBtn.getAttribute('data-copy-prompt');
          const shotTitle = promptBtn.getAttribute('data-shot-title');
          copyToClipboard(promptText, `Copied ${shotTitle} prompt!`);
        }
      });

      // Initial render on load
      renderMatrix();
    })();
  </script>
</body>
</html>
